# Dependabot configuration.
#
# This repo is a markdown skill bundle with no package manifest, so the only
# ecosystem is github-actions. Minor and patch action bumps group into one PR
# per week; the group uses `patterns` rather than `update-types` because a
# SHA pin's SemVer level comes from a trailing comment and an unclassifiable
# action would otherwise fall out of the group and open alone. Majors are
# ignored on the version-update block and need a hand-opened PR.
#
# `target-branch: dev` keeps version updates on the dev -> release/* -> main
# flow that guard-release-branch.yml enforces. Retargeting after the fact
# orphans-and-closes the PR irreversibly, so the block is authored this way
# from the start.
#
# Security updates are raised against the default branch and ignore every
# option on a block that carries `target-branch`, so the trailing block has
# no target-branch, `open-pull-requests-limit: 0` so it never opens version
# updates there, and a group with `applies-to: security-updates` that batches
# minor and patch fixes per run. Cooldown and the majors ignore are absent
# from it on purpose: cooldown is a version-update option, and the ignore
# would suppress a fix that resolves outside the current range.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    reviewers:
      - brettdavies
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
    groups:
      github-actions-security-minor-patch:
        applies-to: security-updates
        update-types:
          - minor
          - patch
