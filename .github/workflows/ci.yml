name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

env:
  # Force JavaScript actions to run on Node 24 (per brettdavies repo policy)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The group key leads with a literal token naming the workflow that owns it. A
# key built only from context (`${{ github.workflow }}`) is one a called
# reusable also produces, because `github.workflow` resolves to the caller
# inside a called workflow; both land in one group and the reusable's queue
# cancels the run that called it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            #node_modules

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck (all shell artifacts)
        # Consumer-side scripts ride along on every `xr skill install <host>`.
        # tests/ and fixtures/bin/ are not shipped to consumers but must lint
        # clean so the producer test loop stays trustworthy.
        # style severity surfaces all suggestions; ShellCheck exits non-zero
        # on error+warning by default (style stays informational).
        run: |
          shellcheck --severity=style \
            scripts/*.sh \
            tests/*.sh \
            fixtures/bin/xr

  scripts-tests:
    name: scripts-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run fixture-driven tests
        # The runner exports JSON envelopes via XR_STUB_* env vars so a bash
        # stub xr at fixtures/bin/xr can replay them. Hits no live API and
        # has no network egress; ubuntu-latest ships jq pre-installed which
        # _common.sh detects automatically.
        run: bash tests/run.sh
