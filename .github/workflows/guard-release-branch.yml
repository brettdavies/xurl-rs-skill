# Rejects PRs to main whose head branch doesn't start with `release/`.
# Calls the centralized reusable workflow. Keeps `dev` off the list of PR
# heads, which is what makes `deleteBranchOnMerge: true` safe to leave on
# without risking `origin/dev`.
#
# The job key must be `guard-release` so the required status check context
# is `guard-release / check-release-branch-name`.
name: Guard release branch pattern

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read

jobs:
  guard-release:
    uses: brettdavies/.github/.github/workflows/guard-release-branch.yml@main
